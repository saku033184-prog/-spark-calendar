<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a00"/>
      <stop offset="55%" stop-color="#ffc400"/>
      <stop offset="100%" stop-color="#ffef9d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <circle cx="92" cy="86" r="8" fill="#fff8c8"/>
  <circle cx="420" cy="112" r="10" fill="#fff8c8"/>
  <circle cx="392" cy="410" r="7" fill="#fff8c8"/>
  <text x="256" y="190" text-anchor="middle" font-family="Georgia,serif"
        font-size="74" font-weight="700" fill="#fff" filter="url(#glow)">Super</text>
  <text x="256" y="300" text-anchor="middle" font-family="Georgia,serif"
        font-size="110" font-weight="900" fill="#fff" filter="url(#glow)">Spark</text>
  <text x="256" y="382" text-anchor="middle" font-family="Arial,sans-serif"
        font-size="54" font-weight="800" fill="#fff8dc">TOKYO</text>
  <text x="256" y="452" text-anchor="middle" font-family="Arial,sans-serif"
        font-size="42" fill="#fff">✦</text>
</svg>