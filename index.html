function start(){const now=new Date(),[y,m]=ym();return now.getFullYear()===y&&now.getMonth()+1===m?now.getDate():1}function nextMap(){const o={},s=start();state.selected.forEach(n=>{const a=Object.keys(d().members[n]||{}).map(Number).filter(x=>x>=s).sort((a,b)=>a-b);if(a.length)o[n]=a[0]});return o}function cal(){calendar.innerHTML='';const[y,m]=ym(),first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate(),sel=[...state.selected],now=new Date();for(let i=0;i<first;i++)calendar.insertAdjacentHTML('beforeend','<div class="day empty"></div>');for(let day=1;day<=days;day++){const cell=document.createElement('div');cell.className='day';if((d().closedDays||[]).includes(day))cell.classList.add('closed');if(now.getFullYear()===y&&now.getMonth()+1===m&&now.getDate()===day)cell.classList.add('today');const present=sel.filter(n=>d().members[n]?.[String(day)]);if(sel.length>1&&present.length===sel.length)cell.classList.add('common');cell.innerHTML=`<div class="num">${day}</div>`;(d().events[String(day)]||[]).forEach(e=>cell.insertAdjacentHTML('beforeend',`<div class="event">${e}</div>`));present.forEach(n=>cell.insertAdjacentHTML('beforeend',`<div class="shift" style="--c:${c(n)}">${n}</div>`));cell.onclick=()=>openModal(day);calendar.appendChild(cell)}legend.innerHTML=sel.map(n=>`<span>${n}</span>`).join('');legend.classList.toggle('hidden',!sel.length);selectedCount.textContent=sel.length;summaryText.textContent=sel.length?`${sel.length}人選択中・全員共演日は金色`:'女の子を選ぶと出演日が表示されます'}

function summary(){const[y,m]=ym(),now=new Date(),day=now.getFullYear()===y&&now.getMonth()+1===m?now.getDate():null,a=day?Object.entries(d().members).filter(([_,s])=>s[String(day)]).map(([n])=>n):[];todayCount.textContent=a.length;eventCount.textContent=Object.values(d().events).filter(x=>x.length).length;todayList.innerHTML=a.length?a.map(n=>`<span class="chip">${n}</span>`).join(''):`<span class="tiny">${day?'今日は出演データなし':'この月は今日ではありません'}</span>`}function openModal(day){const[y,m]=ym(),a=Object.entries(d().members).filter(([_,s])=>s[String(day)]);modalTitle.textContent=`${m}/${day}（${jp[new Date(y,m-1,day).getDay()]}）の出演メンバー`;modalEvent.textContent=(d().events[String(day)]||[]).join(' / ');modalMembers.innerHTML=a.length?a.map(([n,s])=>`<div class="person"><b>${n}</b><span>${s[String(day)]}</span></div>`).join(''):'<div class="tiny">この日の出演データはありません</div>';modal.classList.remove('hidden')}function save(){localStorage.setItem('sparkFavorites',JSON.stringify([...state.favorites]))}function toastMsg(x){toast.textContent=x;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1500)}
clear.onclick=()=>{state.selected.clear();render()};prev.onclick=()=>move(-1);next.onclick=()=>move(1);function move(x){const i=keys.indexOf(state.key)+x;if(i<0||i>=keys.length)return toastMsg('この月のデータはまだないよ');state.key=keys[i];state.selected=new Set([...state.selected].filter(n=>d().members[n]));render()}dark.onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('sparkDark',document.body.classList.contains('dark')?'1':'0')};saveFav.onclick=()=>{state.selected.forEach(n=>state.favorites.add(n));save();memberList();toastMsg('お気に入りに保存したよ♡')};loadFav.onclick=()=>{state.selected=new Set([...state.favorites].filter(n=>d().members[n]));render()};close.onclick=()=>modal.classList.add('hidden');document.querySelector('.backdrop').onclick=()=>modal.classList.add('hidden');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptInstall=e;install.classList.remove('hidden')});install.onclick=async()=>{if(promptInstall){promptInstall.prompt();await promptInstall.userChoice;promptInstall=null;install.classList.add('hidden')}};if(localStorage.getItem('sparkDark')==='1')document.body.classList.add('dark');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});render();</script></body></html>
