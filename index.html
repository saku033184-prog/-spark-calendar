<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff1f7">
<link rel="manifest" href="manifest.webmanifest">
<title>Super Spark Tokyo 出演予定</title>
<style>
:root{
  --pink:#ff8a00;
  --pink2:#ffc300;
  --soft:#fff8e8;
  --soft2:#fff0c7;
  --line:#ffd56a;
  --text:#3c2a12;
  --muted:#9b7330;
  --white:#ffffff;
  --sun:#ff5a36;
  --sat:#c78a00;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
  background:
    radial-gradient(circle at 8% 4%,#fffdf5 0 8%,transparent 23%),
    radial-gradient(circle at 92% 7%,#fff8dc 0 9%,transparent 25%),
    linear-gradient(180deg,#fffdf6 0%,#fff5d9 46%,#ffe7a8 100%);
  min-height:100vh;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  opacity:.62;
  background:
    radial-gradient(ellipse at 7% 17%,#fff 0 7%,transparent 7.5%),
    radial-gradient(ellipse at 16% 17%,#fff 0 8%,transparent 8.5%),
    radial-gradient(ellipse at 91% 15%,#fff 0 8%,transparent 8.5%),
    radial-gradient(ellipse at 80% 16%,#fff 0 7%,transparent 7.5%);
}
button{font:inherit}
main{width:min(100%,850px);margin:auto;padding:14px 14px 56px}
.hero{text-align:center;padding:2px 8px 24px}
.brand{
  display:inline-block;
  color:#ff8a00;
  font-family:Georgia,"Times New Roman",serif;
  font-weight:900;
  line-height:.75;
  letter-spacing:-.06em;
  text-shadow:0 2px 0 #fff7d8,0 0 22px rgba(255,187,0,.28);
  margin-top:8px;
}
.brand .super{display:block;font-size:clamp(44px,13vw,88px)}
.brand .spark{display:block;font-size:clamp(76px,22vw,150px);margin-top:8px}
.brand .tokyo{display:block;font-size:clamp(38px,10vw,70px);margin-top:5px}
.title-pill{
  width:max-content;
  max-width:100%;
  margin:22px auto 10px;
  padding:12px 24px;
  border-radius:22px;
  background:linear-gradient(180deg,#fff5b8,#ffd86f);
  color:var(--pink);
  font-size:clamp(28px,7vw,52px);
  font-weight:1000;
  box-shadow:0 10px 26px rgba(255,159,0,.18),0 0 24px rgba(255,210,74,.22);
}
.subtitle{
  margin:0;
  font-size:clamp(13px,3.3vw,21px);
  color:#9c6c7d;
  font-weight:700;
}
.subtitle strong{color:#151515}
.card{
  background:rgba(255,255,255,.9);
  border:2px solid #ffd76a;
  border-radius:34px;
  box-shadow:0 16px 38px rgba(218,139,0,.12),0 0 24px rgba(255,215,90,.12);
  backdrop-filter:blur(12px);
}
.month-card{
  display:grid;
  grid-template-columns:64px 1fr 64px;
  align-items:center;
  gap:8px;
  padding:18px;
  margin-bottom:18px;
}
.round-btn{
  width:58px;height:58px;border-radius:50%;
  border:2px solid var(--line);
  background:#fff;color:#df4a82;
  font-size:32px;font-weight:900;
  cursor:pointer;
}
.month-label{
  text-align:center;
  font-size:clamp(32px,8vw,58px);
  font-weight:1000;
  color:#050505;
  letter-spacing:-.04em;
}
.selector{padding:20px 18px 22px}
.selector-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:14px;
}
.selector-head h2{
  margin:0;
  color:var(--pink);
  font-size:clamp(20px,5vw,34px);
}
.selector-actions{display:flex;gap:8px}
.small-btn{
  border:1.5px solid var(--line);
  background:#fff8fb;
  color:var(--pink);
  border-radius:14px;
  padding:10px 14px;
  font-weight:900;
  cursor:pointer;
}
.member-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px;
}
.member{
  min-width:0;
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 16px;
  border:1.5px solid #ffd777;
  border-radius:16px;
  background:linear-gradient(180deg,#fffdf7,#fff7dc);
  cursor:pointer;
  color:#241a1e;
  font-weight:900;
}
.member .heart{
  color:var(--pink2);
  font-size:21px;
  flex:none;
}
.member .name{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:clamp(13px,3vw,18px);
}
.member.selected{
  background:linear-gradient(135deg,#fff4b8,#ffd56a);
  border-color:#ff9d00;
  box-shadow:0 8px 18px rgba(255,157,0,.22),0 0 16px rgba(255,218,90,.24);
}
.member.selected .heart::before{content:"♥"}
.member:not(.selected) .heart::before{content:"♡"}
.cta{
  width:100%;
  margin:18px 0 0;
  border:0;
  border-radius:24px;
  padding:18px 20px;
  color:#fff;
  background:linear-gradient(90deg,#ff8a00,#ffc400);
  font-size:clamp(22px,5vw,34px);
  font-weight:1000;
  cursor:pointer;
  box-shadow:0 14px 28px rgba(255,142,0,.28),0 0 22px rgba(255,211,63,.22);
}
.calendar-card{margin-top:24px;overflow:hidden}
.calendar-head{text-align:center;padding:20px 14px 14px}
.calendar-head h2{margin:0;color:var(--pink);font-size:25px}
.calendar-head p{margin:7px 0 0;color:var(--muted);font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 14px}
.legend span{
  border-radius:999px;padding:6px 10px;background:#fff0f5;
  border:1px solid #f4c4d5;color:#d7497d;font-size:11px;font-weight:900;
}
.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.weekdays div{
  text-align:center;padding:8px 0;font-weight:900;background:#fff6cf;
  border-top:1px solid var(--line);border-right:1px solid var(--line)
}
.weekdays .sun{color:var(--sun)} .weekdays .sat{color:var(--sat)}
.day{
  min-width:0;height:94px;padding:4px;overflow:hidden;position:relative;
  background:#fff;border-top:1px solid var(--line);border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);cursor:pointer;
}
.day.empty{background:#fff9fb}
.day.closed{
  background:repeating-linear-gradient(135deg,#fff0f3,#fff0f3 8px,#ffe1e8 8px,#ffe1e8 16px)
}
.day.common{
  background:linear-gradient(180deg,#fffce6,#fff1b5);
  box-shadow:inset 0 0 0 2px #ffd55c
}
.day.today{box-shadow:inset 0 0 0 3px #ef3d78}
.day-number{font-size:12px;font-weight:1000}
.day:nth-child(7n+1) .day-number{color:var(--sun)}
.day:nth-child(7n) .day-number{color:var(--sat)}
.event{font-size:7px;line-height:1.1;color:#df4d82;font-weight:900;margin:2px 0}
.shift{
  margin:2px 0;padding:3px 2px;border-radius:6px;
  background:linear-gradient(90deg,#ff9b00,#ffbd23);color:#fff;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-size:7px;font-weight:1000;
}
.next-wrap{padding:18px;margin-top:18px}
.next-wrap h2{margin:0 0 12px;color:var(--pink)}
.next-cards{display:flex;gap:10px;overflow:auto}
.next-card{
  min-width:180px;border:1px solid #ffd56a;border-radius:18px;
  background:#fff9e9;padding:14px
}
.next-card b{color:var(--pink);font-size:17px}
.next-date{font-size:22px;font-weight:1000;margin:7px 0}
.next-card small{color:var(--muted)}
.modal{
  position:fixed;inset:0;z-index:100;display:grid;place-items:end center
}
.modal.hidden{display:none}
.backdrop{position:absolute;inset:0;background:rgba(63,29,43,.42);backdrop-filter:blur(5px)}
.modal-card{
  position:relative;width:min(100%,850px);max-height:84vh;overflow:auto;
  background:#fff9e9;border-radius:30px 30px 0 0;padding:24px 18px 28px;
  box-shadow:0 -20px 60px rgba(197,57,108,.25)
}
.close{
  position:absolute;right:16px;top:14px;width:44px;height:44px;border-radius:50%;
  border:1px solid #f2bdd0;background:#fff;color:var(--pink);font-size:28px
}
.modal-card h2{margin:0 54px 8px 0;color:var(--pink)}
.modal-event{color:#d84c80;font-weight:900;margin-bottom:12px}
.modal-members{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.modal-member{
  border:1px solid #f3c4d4;background:#fff;border-radius:14px;padding:11px
}
.modal-member b{display:block;color:#d7477d}
.modal-member span{font-size:11px;color:#76515f;font-weight:800}
.reserve{
  display:block;margin-top:16px;text-align:center;text-decoration:none;color:#fff;
  background:linear-gradient(90deg,#ff8a00,#ffc400);border-radius:17px;
  padding:14px;font-weight:1000
}
.hidden{display:none!important}
.toast{
  position:fixed;left:50%;bottom:20px;z-index:300;
  transform:translate(-50%,100px);
  background:#fff;color:#b86b00;border:1px solid #ffd36c;border-radius:999px;
  padding:11px 16px;font-weight:900;transition:.25s
}
.toast.show{transform:translate(-50%,0)}
body.modal-open{overflow:hidden}
@media(max-width:600px){
  main{padding:8px 7px 38px}
  .hero{padding-bottom:18px}
  .month-card{grid-template-columns:50px 1fr 50px;padding:13px}
  .round-btn{width:48px;height:48px;font-size:26px}
  .selector{padding:16px 10px 18px}
  .selector-head{align-items:flex-start}
  .selector-actions{flex-direction:column}
  .small-btn{padding:8px 9px;font-size:11px}
  .member-grid{gap:6px}
  .member{padding:11px 8px;gap:6px}
  .member .heart{font-size:17px}
  .day{height:84px;padding:2px}
  .event{font-size:6.2px}
  .shift{font-size:6.4px}
}

/* Gold show-club theme */
body::after{
  content:"";
  position:fixed;
  inset:-20% -10%;
  pointer-events:none;
  z-index:-1;
  background:
    conic-gradient(from 205deg at 20% 0%,transparent 0 8deg,rgba(255,210,71,.12) 9deg 15deg,transparent 16deg 28deg),
    conic-gradient(from 150deg at 80% 0%,transparent 0 9deg,rgba(255,159,0,.11) 10deg 17deg,transparent 18deg 31deg);
  animation:showLights 7s ease-in-out infinite alternate;
}
@keyframes showLights{
  from{transform:translateX(-1.5%) rotate(-1deg);opacity:.72}
  to{transform:translateX(1.5%) rotate(1deg);opacity:1}
}
.hero{position:relative;overflow:hidden}
.hero::before,.hero::after{
  content:"✦";
  position:absolute;
  color:#ffc400;
  font-size:28px;
  filter:drop-shadow(0 0 8px rgba(255,180,0,.55));
  animation:sparkle 1.7s ease-in-out infinite alternate;
}
.hero::before{left:9%;top:17%}
.hero::after{right:10%;top:28%;animation-delay:.7s}
@keyframes sparkle{
  from{transform:scale(.75) rotate(0deg);opacity:.45}
  to{transform:scale(1.18) rotate(18deg);opacity:1}
}
.brand{filter:drop-shadow(0 7px 14px rgba(255,140,0,.18))}
.card{position:relative}
.card::before{
  content:"";
  position:absolute;
  inset:1px;
  border-radius:inherit;
  pointer-events:none;
  background:linear-gradient(120deg,rgba(255,255,255,.46),transparent 25%,transparent 72%,rgba(255,232,140,.22));
}
.member,.small-btn,.round-btn,.cta{transition:.2s ease}
.member:hover,.small-btn:hover,.round-btn:hover{transform:translateY(-2px)}
.cta:hover{transform:translateY(-2px);filter:brightness(1.03)}
.member.selected{animation:selectedGlow 1.5s ease-in-out infinite alternate}
@keyframes selectedGlow{
  from{box-shadow:0 8px 18px rgba(255,157,0,.18),0 0 10px rgba(255,218,90,.18)}
  to{box-shadow:0 10px 24px rgba(255,142,0,.30),0 0 24px rgba(255,225,96,.38)}
}
.month-label,.calendar-head h2,.selector-head h2{
  text-shadow:0 2px 0 #fff3bf,0 0 14px rgba(255,188,0,.18);
}
.day.common{animation:goldPulse 1.8s ease-in-out infinite alternate}
@keyframes goldPulse{
  from{box-shadow:inset 0 0 0 2px #ffd55c,0 0 5px rgba(255,195,0,.18)}
  to{box-shadow:inset 0 0 0 2px #ffb000,0 0 18px rgba(255,195,0,.42)}
}


/* Per-member color coding */
.member{
  --member-strong:#ff9f0a;
  --member-soft:#fff0d6;
}
.member.selected{
  background:linear-gradient(135deg,var(--member-soft),#fff);
  border-color:var(--member-strong);
  box-shadow:
    0 8px 18px color-mix(in srgb,var(--member-strong) 24%,transparent),
    0 0 16px color-mix(in srgb,var(--member-strong) 18%,transparent);
}
.member.selected .heart,
.member.selected .name{
  color:var(--member-strong);
}
.shift{
  --shift-strong:#ff9f0a;
  --shift-soft:#fff0d6;
  background:linear-gradient(90deg,var(--shift-strong),color-mix(in srgb,var(--shift-strong) 72%,white));
  border:1px solid color-mix(in srgb,var(--shift-strong) 72%,#7a4b00);
  box-shadow:0 2px 7px color-mix(in srgb,var(--shift-strong) 28%,transparent);
}
.legend span{
  --legend-strong:#ff9f0a;
  --legend-soft:#fff0d6;
  background:var(--legend-soft);
  border-color:color-mix(in srgb,var(--legend-strong) 48%,white);
  color:var(--legend-strong);
}


/* Compact mobile first-screen layout */
@media(max-width:600px){
  main{
    padding:2px 5px 28px;
  }
  .hero{
    padding:0 4px 7px;
  }
  .brand{
    margin-top:0;
    line-height:.67;
  }
  .brand .super{
    font-size:30px;
  }
  .brand .spark{
    font-size:54px;
    margin-top:3px;
  }
  .brand .tokyo{
    font-size:27px;
    margin-top:3px;
  }
  .title-pill{
    margin:8px auto 4px;
    padding:5px 15px;
    border-radius:14px;
    font-size:21px;
  }
  .subtitle{
    font-size:10px;
    line-height:1.15;
  }
  .month-card{
    grid-template-columns:38px 1fr 38px;
    gap:4px;
    padding:6px 8px;
    margin-bottom:7px;
    border-radius:20px;
  }
  .round-btn{
    width:34px;
    height:34px;
    font-size:21px;
    border-width:1.5px;
  }
  .month-label{
    font-size:24px;
  }
  .selector{
    padding:8px 7px 9px;
    border-radius:22px;
  }
  .selector-head{
    margin-bottom:6px;
    gap:5px;
    align-items:center;
  }
  .selector-head h2{
    font-size:15px;
    line-height:1.05;
    white-space:nowrap;
  }
  .selector-actions{
    flex-direction:row;
    gap:4px;
  }
  .small-btn{
    padding:5px 7px;
    border-radius:10px;
    font-size:9px;
    white-space:nowrap;
  }
  .member-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:3px;
  }
  .member{
    min-height:29px;
    padding:4px 5px;
    gap:4px;
    border-radius:10px;
    border-width:1px;
  }
  .member .heart{
    font-size:12px;
  }
  .member .name{
    font-size:10.5px;
    line-height:1;
  }
  .calendar-card{
    margin-top:8px;
  }
  .hero::before,.hero::after{
    font-size:15px;
  }
}

/* Slightly shorter phones */
@media(max-width:600px) and (max-height:760px){
  .brand .super{font-size:26px}
  .brand .spark{font-size:46px}
  .brand .tokyo{font-size:23px}
  .title-pill{font-size:18px;padding:4px 12px;margin-top:6px}
  .subtitle{font-size:9px}
  .month-card{padding:4px 7px;margin-bottom:5px}
  .month-label{font-size:21px}
  .round-btn{width:31px;height:31px;font-size:19px}
  .selector{padding:6px}
  .selector-head{margin-bottom:4px}
  .selector-head h2{font-size:13px}
  .small-btn{font-size:8px;padding:4px 6px}
  .member-grid{gap:2px}
  .member{min-height:26px;padding:3px 4px}
  .member .heart{font-size:11px}
  .member .name{font-size:9.5px}
}

</style>
</head>
<body>
<main>
  <header class="hero">
    <div class="brand" aria-label="Super Spark Tokyo">
      <span class="super">Super</span>
      <span class="spark">Spark</span>
      <span class="tokyo">Tokyo</span>
    </div>
    <div class="title-pill">♡ 出演予定 ♡</div>
    <p class="subtitle">会いたい子を選ぶと、共演日・次の出演日・<strong>がわかります</strong></p>
  </header>

  <section class="card month-card">
    <button id="prevBtn" class="round-btn" aria-label="前の月">‹</button>
    <div id="monthLabel" class="month-label"></div>
    <button id="nextBtn" class="round-btn" aria-label="次の月">›</button>
  </section>

  <section class="card selector">
    <div class="selector-head">
      <h2>✦ 出演する女の子を選ぼう</h2>
      <div class="selector-actions">
        <button id="allBtn" class="small-btn">すべて選択</button>
        <button id="clearBtn" class="small-btn">すべて解除</button>
      </div>
    </div>
    <div id="memberGrid" class="member-grid"></div>
    
  </section>

  <section id="calendarSection" class="card calendar-card">
    <div class="calendar-head">
      <h2 id="calendarTitle"></h2>
      <p id="selectedSummary">女の子を選ぶと出演日が表示されます</p>
    </div>
    <div id="legend" class="legend hidden"></div>
    <div class="weekdays">
      <div class="sun">日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div class="sat">土</div>
    </div>
    <div id="calendar" class="calendar"></div>
  </section>

  <section id="nextSection" class="card next-wrap hidden">
    <h2>次の出演日</h2>
    <div id="nextCards" class="next-cards"></div>
  </section>
</main>

<div id="dayModal" class="modal hidden" aria-hidden="true">
  <div class="backdrop"></div>
  <div class="modal-card">
    <button id="closeBtn" class="close">×</button>
    <h2 id="modalTitle"></h2>
    <div id="modalEvent" class="modal-event"></div>
    <div id="modalMembers" class="modal-members"></div>
    <a class="reserve" href="https://superspark.tokyo/booking/" target="_blank" rel="noopener noreferrer">✦ 予約はこちら</a>
  </div>
</div>

const monthKeys=Object.keys(MONTHS).sort();
const state={key:monthKeys.includes("2026-08")?"2026-08":monthKeys[0],selected:new Set()};
const daysJP=["日","月","火","水","木","金","土"];
const memberPalette=[
  ["#ff5d8f","#ffe8f0"],
  ["#ff9f0a","#fff0d6"],
  ["#83c51d","#eff9dc"],
  ["#4da3ff","#e8f3ff"],
  ["#a66cff","#f1e9ff"],
  ["#17b8a6","#e4faf7"],
  ["#f06bce","#fde8f8"],
  ["#e26d3f","#fff0e9"],
  ["#6f78ff","#eceeff"],
  ["#d8a400","#fff7d6"]
];

function selectedColor(name){
  const index=[...state.selected].indexOf(name);
  return memberPalette[(index<0?0:index)%memberPalette.length];
}

function current(){return MONTHS[state.key]}
function parts(){const [y,m]=state.key.split("-").map(Number);return {y,m}}
function init(){bind();renderAll()}
function bind(){
  prevBtn.onclick=()=>move(-1);
  nextBtn.onclick=()=>move(1);
  clearBtn.onclick=()=>{state.selected.clear();renderAll()};
  allBtn.onclick=()=>{state.selected=new Set(Object.keys(current().members));renderAll()};
  
  closeBtn.onclick=closeModal;
  document.querySelector(".backdrop").onclick=closeModal;
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
}
function move(dir){
  const i=monthKeys.indexOf(state.key),ni=i+dir;
  if(ni<0||ni>=monthKeys.length){showToast("この月のデータはまだないよ");return}
  state.key=monthKeys[ni];
  state.selected=new Set([...state.selected].filter(n=>current().members[n]));
  renderAll()
}
function renderAll(){renderHeader();renderMembers();renderCalendar();renderNext()}
function renderHeader(){
  const {y,m}=parts();
  monthLabel.textContent=`${y}年${m}月 ${m===8?"☀️":"🎀"}`;
  calendarTitle.textContent=`${y}年${m}月 出演カレンダー`;
  prevBtn.disabled=monthKeys.indexOf(state.key)===0;
  nextBtn.disabled=monthKeys.indexOf(state.key)===monthKeys.length-1;
}
function renderMembers(){
  memberGrid.innerHTML="";
  Object.entries(current().members)
    .sort((a,b)=>Object.keys(b[1]).length-Object.keys(a[1]).length)
    .forEach(([name])=>{
      const b=document.createElement("button");
      b.className="member"+(state.selected.has(name)?" selected":"");
      b.type="button";
      if(state.selected.has(name)){
        const [strong,soft]=selectedColor(name);
        b.style.setProperty("--member-strong",strong);
        b.style.setProperty("--member-soft",soft);
      }
      b.innerHTML=`<span class="heart"></span><span class="name">${name}</span>`;
      b.onclick=()=>{
        state.selected.has(name)?state.selected.delete(name):state.selected.add(name);
        renderAll()
      };
      memberGrid.appendChild(b)
    })
}
function renderCalendar(){
  calendar.innerHTML="";
  const {y,m}=parts();
  const first=new Date(y,m-1,1).getDay();
  const count=new Date(y,m,0).getDate();
  const selected=[...state.selected];
  const now=new Date();

  for(let i=0;i<first;i++) calendar.insertAdjacentHTML("beforeend",'<div class="day empty"></div>');

  for(let d=1;d<=count;d++){
    const cell=document.createElement("div");
    cell.className="day";
    const present=selected.filter(name=>current().members[name]?.[String(d)]);
    if(selected.length>1&&present.length===selected.length) cell.classList.add("common");
    if((current().closedDays||[]).includes(d)) cell.classList.add("closed");
    if(now.getFullYear()===y&&now.getMonth()+1===m&&now.getDate()===d) cell.classList.add("today");
    cell.innerHTML=`<div class="day-number">${d}</div>`;
    (current().events[String(d)]||[]).forEach(e=>cell.insertAdjacentHTML("beforeend",`<div class="event">${e}</div>`));
    present.forEach(name=>{
      const [strong,soft]=selectedColor(name);
      cell.insertAdjacentHTML(
        "beforeend",
        `<div class="shift" style="--shift-strong:${strong};--shift-soft:${soft}">${name}</div>`
      );
    });
    cell.onclick=()=>openModal(d);
    calendar.appendChild(cell)
  }

  if(selected.length){
    selectedSummary.textContent=`${selected.length}人選択中・全員が出演する日は金色`;
    legend.classList.remove("hidden");
    legend.innerHTML=selected.map(n=>{
      const [strong,soft]=selectedColor(n);
      return `<span style="--legend-strong:${strong};--legend-soft:${soft}">${n}</span>`;
    }).join("")
  }else{
    selectedSummary.textContent="女の子を選ぶと出演日が表示されます";
    legend.classList.add("hidden");
    legend.innerHTML=""
  }
}
function getStart(){
  const {y,m}=parts(),now=new Date();
  return now.getFullYear()===y&&now.getMonth()+1===m?now.getDate():1
}
function renderNext(){
  nextCards.innerHTML="";
  if(!state.selected.size){nextSection.classList.add("hidden");return}
  nextSection.classList.remove("hidden");
  const {y,m}=parts(),start=getStart();
  [...state.selected].forEach(name=>{
    const schedule=current().members[name]||{};
    const days=Object.keys(schedule).map(Number).filter(d=>d>=start).sort((a,b)=>a-b);
    const d=days[0];
    const card=document.createElement("div");
    card.className="next-card";
    card.innerHTML=d
      ?`<b>${name}</b><div class="next-date">${m}/${d}（${daysJP[new Date(y,m-1,d).getDay()]}）</div><div>${schedule[String(d)]}</div><small>今月あと${days.length}日出演予定</small>`
      :`<b>${name}</b><div class="next-date">今月は終了</div>`;
    nextCards.appendChild(card)
  })
}
function membersOn(day){
  return Object.entries(current().members)
    .filter(([_,s])=>s[String(day)])
    .map(([name,s])=>({name,shift:s[String(day)]}))
}
function openModal(day){
  const {y,m}=parts();
  const members=membersOn(day);
  modalTitle.textContent=`${m}/${day}（${daysJP[new Date(y,m-1,day).getDay()]}）の出演メンバー`;
  modalEvent.textContent=(current().events[String(day)]||[]).join(" / ");
  modalMembers.innerHTML=members.length
    ?members.map(x=>`<div class="modal-member"><b>${x.name}</b><span>${x.shift}</span></div>`).join("")
    :`<div>この日の出演データはありません</div>`;
  dayModal.classList.remove("hidden");
  document.body.classList.add("modal-open")
}
function closeModal(){
  dayModal.classList.add("hidden");
  document.body.classList.remove("modal-open")
}
function showToast(msg){
  toast.textContent=msg;toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),1500)
}
init();
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./sw.js").catch(()=>{});
  });
}
</script>
